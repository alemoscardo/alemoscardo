<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" role="img" aria-labelledby="title desc">
  <title id="title">Trainer Red system architecture</title>
  <desc id="desc">Rules exported from Pokemon Showdown feed the vgcjax JAX battle engine. The engine drives self-play PPO training on eight GPUs. The exported policy and the same engine power a decision-time CFR search that serves the Wisp web app and a Showdown ladder bot.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6e7781"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
      .title { font-size: 17px; font-weight: 700; }
      .meta { font-size: 11.5px; fill: #656d76; }
      .panel { font-size: 13.5px; font-weight: 700; }
      .badge { font-size: 11px; font-weight: 700; fill: #ffffff; }
      .t { font-size: 12.5px; font-weight: 600; }
      .s { font-size: 11.5px; fill: #57606a; }
      .l { font-size: 11px; fill: #656d76; }
      .g { font-size: 10px; fill: #656d76; }
      .step { font-size: 12px; font-weight: 700; }
      .ar { stroke: #6e7781; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .ln { stroke: #6e7781; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="999" height="759" rx="14" fill="#ffffff" stroke="#d0d7de"/>
  <text class="title" x="24" y="40">Trainer Red — system overview</text>
  <text class="meta" x="976" y="40" text-anchor="end">JAX engine · self-play PPO · decision-time CFR search</text>

  <!-- Panel 1: rules and data -->
  <rect x="24" y="64" width="280" height="360" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <circle cx="48" cy="88" r="10" fill="#6e7781"/>
  <text class="badge" x="48" y="92" text-anchor="middle">1</text>
  <text class="panel" x="66" y="93">Rules &amp; data</text>

  <rect x="40" y="112" width="248" height="50" rx="8" fill="#ffffff" stroke="#afb8c1"/>
  <text class="t" x="52" y="132">Pokémon Showdown (reference)</text>
  <text class="s" x="52" y="150">pinned commit · Champions mod</text>
  <path class="ar" d="M164 162 V203"/>
  <text class="l" x="174" y="187">export (Node.js)</text>

  <rect x="40" y="205" width="248" height="50" rx="8" fill="#ffffff" stroke="#afb8c1"/>
  <text class="t" x="52" y="225">Rule compiler</text>
  <text class="s" x="52" y="243">exported data + effect mapping</text>
  <path class="ar" d="M164 255 V296"/>
  <text class="l" x="174" y="280">compile</text>

  <rect x="40" y="298" width="248" height="50" rx="8" fill="#ffffff" stroke="#afb8c1"/>
  <text class="t" x="52" y="318">Integer rule tables</text>
  <text class="s" x="52" y="336">coverage gate: unsupported ⇒ reject</text>

  <rect x="40" y="360" width="248" height="50" rx="8" fill="#ffffff" stroke="#afb8c1"/>
  <text class="t" x="52" y="380">Tournament team pools</text>
  <text class="s" x="52" y="398">thousands of Reg M-C event teams</text>

  <!-- Panel 2: engine -->
  <rect x="360" y="64" width="280" height="360" rx="12" fill="#eef3fe" stroke="#b6c8f5"/>
  <circle cx="384" cy="88" r="10" fill="#3b63c9"/>
  <text class="badge" x="384" y="92" text-anchor="middle">2</text>
  <text class="panel" x="402" y="93">vgcjax engine (JAX / XLA)</text>

  <rect x="376" y="112" width="248" height="50" rx="8" fill="#ffffff" stroke="#9db4ea"/>
  <text class="t" x="388" y="132">Batched, compiled interface</text>
  <text class="s" x="388" y="150">reset · legal actions · step · observe</text>

  <rect x="376" y="174" width="248" height="50" rx="8" fill="#ffffff" stroke="#9db4ea"/>
  <text class="t" x="388" y="194">Thousands of battles at once</text>
  <text class="s" x="388" y="212">fixed-shape integer state</text>

  <rect x="376" y="236" width="248" height="50" rx="8" fill="#ffffff" stroke="#9db4ea"/>
  <text class="t" x="388" y="256">Branchless mechanics</text>
  <text class="s" x="388" y="274">masks instead of control flow</text>

  <rect x="376" y="298" width="248" height="50" rx="8" fill="#ffffff" stroke="#9db4ea"/>
  <text class="t" x="388" y="318">Mechanics as table rows</text>
  <text class="s" x="388" y="336">~40 generic, masked kernels</text>

  <rect x="376" y="360" width="248" height="50" rx="8" fill="#ffffff" stroke="#9db4ea"/>
  <text class="t" x="388" y="380">No branching in the graph</text>
  <text class="s" x="388" y="398">compile budget enforced in CI</text>

  <!-- Panel 3: training -->
  <rect x="696" y="64" width="280" height="360" rx="12" fill="#ecf7f0" stroke="#a8dcbb"/>
  <circle cx="720" cy="88" r="10" fill="#2a8a55"/>
  <text class="badge" x="720" y="92" text-anchor="middle">3</text>
  <text class="panel" x="738" y="93">Self-play PPO · 8× RTX 5090</text>

  <rect x="712" y="112" width="248" height="62" rx="8" fill="#ffffff" stroke="#93cfa9"/>
  <text class="t" x="724" y="132">Self-play collector</text>
  <text class="s" x="724" y="149">thousands of battles in parallel</text>
  <text class="s" x="724" y="164">entirely on the GPU</text>
  <path class="ar" d="M836 174 V196"/>
  <text class="l" x="846" y="189">trajectories</text>

  <rect x="712" y="198" width="248" height="50" rx="8" fill="#ffffff" stroke="#93cfa9"/>
  <text class="t" x="724" y="218">PPO update</text>
  <text class="s" x="724" y="236">data-parallel across 8 GPUs</text>
  <path class="ar" d="M836 248 V270"/>
  <text class="l" x="846" y="263">weights</text>

  <rect x="712" y="272" width="248" height="50" rx="8" fill="#ffffff" stroke="#93cfa9"/>
  <text class="t" x="724" y="292">Policy / value network</text>
  <text class="s" x="724" y="310">Transformer + recurrent memory</text>
  <path class="ar" d="M836 322 V344"/>
  <text class="l" x="846" y="337">export</text>

  <rect x="712" y="346" width="248" height="50" rx="8" fill="#ffffff" stroke="#93cfa9"/>
  <text class="t" x="724" y="366">Checkpoint + policy export</text>
  <text class="s" x="724" y="384">versioned, reproducible runs</text>

  <!-- policy acts in the collector -->
  <path class="ar" d="M960 297 H968 V143 H962"/>

  <!-- Panel 4: search -->
  <rect x="24" y="456" width="616" height="280" rx="12" fill="#fdf5e8" stroke="#f0cf98"/>
  <circle cx="48" cy="480" r="10" fill="#c27c12"/>
  <text class="badge" x="48" y="484" text-anchor="middle">4</text>
  <text class="panel" x="66" y="485">Decision-time search (Wisp worker)</text>

  <rect x="40" y="508" width="120" height="118" rx="8" fill="#ffffff" stroke="#e8bb6e"/>
  <text class="step" x="52" y="530">1 · Propose</text>
  <text class="s" x="52" y="552">the policy</text>
  <text class="s" x="52" y="567">shortlists actions</text>
  <text class="s" x="52" y="582">for each side</text>
  <path class="ar" d="M160 567 H176"/>

  <rect x="178" y="508" width="170" height="118" rx="8" fill="#ffffff" stroke="#e8bb6e"/>
  <text class="step" x="190" y="530">2 · Payoff matrix</text>
  <g transform="translate(239 538)">
    <rect x="0"  y="0"  width="7" height="7" fill="#3b63c9"/><rect x="8"  y="0"  width="7" height="7" fill="#8fa9ea"/><rect x="16" y="0"  width="7" height="7" fill="#dbe4fb"/><rect x="24" y="0"  width="7" height="7" fill="#f2b56b"/><rect x="32" y="0"  width="7" height="7" fill="#8fa9ea"/><rect x="40" y="0"  width="7" height="7" fill="#dbe4fb"/>
    <rect x="0"  y="8"  width="7" height="7" fill="#fbe3c6"/><rect x="8"  y="8"  width="7" height="7" fill="#3b63c9"/><rect x="16" y="8"  width="7" height="7" fill="#8fa9ea"/><rect x="24" y="8"  width="7" height="7" fill="#dbe4fb"/><rect x="32" y="8"  width="7" height="7" fill="#d9822b"/><rect x="40" y="8"  width="7" height="7" fill="#8fa9ea"/>
    <rect x="0"  y="16" width="7" height="7" fill="#8fa9ea"/><rect x="8"  y="16" width="7" height="7" fill="#f2b56b"/><rect x="16" y="16" width="7" height="7" fill="#dbe4fb"/><rect x="24" y="16" width="7" height="7" fill="#3b63c9"/><rect x="32" y="16" width="7" height="7" fill="#fbe3c6"/><rect x="40" y="16" width="7" height="7" fill="#dbe4fb"/>
    <rect x="0"  y="24" width="7" height="7" fill="#d9822b"/><rect x="8"  y="24" width="7" height="7" fill="#dbe4fb"/><rect x="16" y="24" width="7" height="7" fill="#3b63c9"/><rect x="24" y="24" width="7" height="7" fill="#fbe3c6"/><rect x="32" y="24" width="7" height="7" fill="#8fa9ea"/><rect x="40" y="24" width="7" height="7" fill="#f2b56b"/>
    <rect x="0"  y="32" width="7" height="7" fill="#dbe4fb"/><rect x="8"  y="32" width="7" height="7" fill="#8fa9ea"/><rect x="16" y="32" width="7" height="7" fill="#fbe3c6"/><rect x="24" y="32" width="7" height="7" fill="#8fa9ea"/><rect x="32" y="32" width="7" height="7" fill="#3b63c9"/><rect x="40" y="32" width="7" height="7" fill="#dbe4fb"/>
    <rect x="0"  y="40" width="7" height="7" fill="#f2b56b"/><rect x="8"  y="40" width="7" height="7" fill="#dbe4fb"/><rect x="16" y="40" width="7" height="7" fill="#8fa9ea"/><rect x="24" y="40" width="7" height="7" fill="#d9822b"/><rect x="32" y="40" width="7" height="7" fill="#dbe4fb"/><rect x="40" y="40" width="7" height="7" fill="#3b63c9"/>
  </g>
  <text class="s" x="190" y="602">each cell = one turn</text>
  <text class="s" x="190" y="617">simulated in vgcjax</text>
  <path class="ar" d="M348 567 H364"/>

  <rect x="366" y="508" width="118" height="118" rx="8" fill="#ffffff" stroke="#e8bb6e"/>
  <text class="step" x="378" y="530">3 · Evaluate</text>
  <text class="s" x="378" y="552">value network on</text>
  <text class="s" x="378" y="567">resulting boards;</text>
  <text class="s" x="378" y="582">end of game: ±1</text>
  <path class="ar" d="M484 567 H500"/>

  <rect x="502" y="508" width="122" height="118" rx="8" fill="#ffffff" stroke="#e8bb6e"/>
  <text class="step" x="514" y="530">4 · Solve</text>
  <text class="s" x="514" y="552">regret matching</text>
  <text class="s" x="514" y="567">(CFR)</text>
  <text class="s" x="514" y="582">→ mixed strategy</text>

  <rect x="40" y="642" width="584" height="72" rx="8" fill="#ffffff" stroke="#e8bb6e" stroke-dasharray="5 4"/>
  <text class="t" x="56" y="666">Key idea</text>
  <text class="s" x="56" y="685">Every cell is a real engine turn, not a learned model of the game.</text>
  <text class="s" x="56" y="701">Chance and hidden information are averaged over sampled outcomes.</text>

  <!-- Panel 5: serving -->
  <rect x="696" y="456" width="280" height="280" rx="12" fill="#f4f0fc" stroke="#cdbff0"/>
  <circle cx="720" cy="480" r="10" fill="#7a5ccf"/>
  <text class="badge" x="720" y="484" text-anchor="middle">5</text>
  <text class="panel" x="738" y="485">Serving &amp; play</text>

  <rect x="712" y="508" width="248" height="50" rx="8" fill="#ffffff" stroke="#b9a6ea"/>
  <text class="t" x="724" y="528">Inference API</text>
  <text class="s" x="724" y="546">Node HTTP → Python/JAX worker</text>

  <path class="ln" d="M724 558 V683"/>
  <path class="ar" d="M724 605 H738"/>
  <path class="ar" d="M724 683 H738"/>

  <rect x="740" y="574" width="220" height="62" rx="8" fill="#ffffff" stroke="#b9a6ea"/>
  <text class="t" x="752" y="594">Wisp web app</text>
  <text class="s" x="752" y="611">React · TypeScript · @pkmn/sim</text>
  <text class="s" x="752" y="626">Lab boards · search inspector</text>

  <rect x="740" y="652" width="220" height="62" rx="8" fill="#ffffff" stroke="#b9a6ea"/>
  <text class="t" x="752" y="672">Showdown ladder bot</text>
  <text class="s" x="752" y="689">Bo3 games on the public ladder</text>
  <text class="s" x="752" y="704">journaled, fail-closed runner</text>

  <!-- cross-panel flows -->
  <path class="ar" d="M288 323 H374"/>
  <text class="g" x="331" y="315" text-anchor="middle">rule tables</text>

  <path class="ar" d="M624 130 H710"/>
  <text class="g" x="667" y="123" text-anchor="middle">obs · masks</text>
  <path class="ar" d="M712 152 H626"/>
  <text class="g" x="668" y="169" text-anchor="middle">actions</text>

  <path class="ar" d="M500 410 V454"/>
  <text class="l" x="510" y="444">simulates matrix cells</text>

  <path class="ar" d="M836 396 V454"/>
  <text class="l" x="846" y="444">policy weights</text>

  <path class="ar" d="M712 526 H642"/>
  <text class="g" x="676" y="519" text-anchor="middle">request</text>
  <path class="ar" d="M640 544 H710"/>
  <text class="g" x="676" y="561" text-anchor="middle">strategy</text>
</svg>
