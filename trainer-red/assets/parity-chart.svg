<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-labelledby="t d">
<title id="t">Statistical parity between vgcjax and Pokemon Showdown</title>
<desc id="d">Dot plot of 50 team pairings with 2,000 games each per simulator. Every win-rate difference between vgcjax and Showdown lies within plus or minus 3 percentage points; the largest is 2.70.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#0b0b0b}.ttl{font-size:17px;font-weight:700}.sub{font-size:13px;fill:#52514e}.tk{font-size:12px;fill:#898781}.ax{font-size:12.5px;fill:#52514e}.bl{font-size:12px;fill:#52514e;font-weight:600}</style>
<rect x="0.5" y="0.5" width="999" height="399" rx="14" fill="#ffffff" stroke="#d0d7de"/>
<text class="ttl" x="28" y="38">vgcjax matches Showdown on all 50 team pairings</text>
<text class="sub" x="28" y="60">2,000 games per pairing on each simulator, same random policy. Difference in side-A win rate; the band is the ±3 pp gate, fixed before the test.</text>
