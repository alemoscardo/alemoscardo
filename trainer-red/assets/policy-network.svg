<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 416" width="1000" height="416" role="img" aria-labelledby="title desc">
  <title id="title">Trainer Red policy and value network</title>
  <desc id="desc">Sixty-one input tokens (one field token, twelve Pokemon tokens and forty-eight move tokens) pass through a Transformer encoder. A recurrent memory carries information across turns. A joint action head, a team preview head and a value head read the contextual tokens.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6e7781"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
      .title { font-size: 15px; font-weight: 700; }
      .t { font-size: 13px; font-weight: 600; }
      .s { font-size: 11.5px; fill: #57606a; }
      .l { font-size: 11px; fill: #656d76; }
      .bar { font-size: 11px; fill: #3b4a6b; }
      .muted { font-size: 13px; font-weight: 600; fill: #57606a; }
      .ar { stroke: #6e7781; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .ln { stroke: #6e7781; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="999" height="415" rx="14" fill="#ffffff" stroke="#d0d7de"/>
  <text class="title" x="24" y="32">Policy / value network — player view, 7.1M parameters</text>

  <!-- Inputs -->
  <rect x="24" y="50" width="280" height="56" rx="8" fill="#f6f8fa" stroke="#afb8c1"/>
  <text class="t" x="40" y="72">Field token</text>
  <text class="s" x="40" y="90">weather · terrain · screens · turn</text>
  <rect x="278" y="70" width="12" height="12" rx="2" fill="#57606a"/>

  <rect x="24" y="118" width="280" height="78" rx="8" fill="#f6f8fa" stroke="#afb8c1"/>
  <text class="t" x="40" y="139">12 Pokémon tokens</text>
  <text class="s" x="40" y="156">own six: exact sets &amp; stats</text>
  <text class="s" x="40" y="171">foes: open team sheet,</text>
  <text class="s" x="40" y="186">HP %, status, boosts</text>
  <g>
    <rect x="216" y="136" width="10" height="10" rx="2" fill="#4f7cdb"/><rect x="229" y="136" width="10" height="10" rx="2" fill="#4f7cdb"/><rect x="242" y="136" width="10" height="10" rx="2" fill="#4f7cdb"/><rect x="255" y="136" width="10" height="10" rx="2" fill="#4f7cdb"/><rect x="268" y="136" width="10" height="10" rx="2" fill="#4f7cdb"/><rect x="281" y="136" width="10" height="10" rx="2" fill="#4f7cdb"/>
    <rect x="216" y="149" width="10" height="10" rx="2" fill="#d08a2a"/><rect x="229" y="149" width="10" height="10" rx="2" fill="#d08a2a"/><rect x="242" y="149" width="10" height="10" rx="2" fill="#d08a2a"/><rect x="255" y="149" width="10" height="10" rx="2" fill="#d08a2a"/><rect x="268" y="149" width="10" height="10" rx="2" fill="#d08a2a"/><rect x="281" y="149" width="10" height="10" rx="2" fill="#d08a2a"/>
  </g>

  <rect x="24" y="208" width="280" height="56" rx="8" fill="#f6f8fa" stroke="#afb8c1"/>
  <text class="t" x="40" y="230">48 move tokens</text>
  <text class="s" x="40" y="248">4 per Pokémon, tied to owner</text>
  <g id="moves">
    <g fill="#4f7cdb">
      <rect x="212" y="215" width="5" height="5"/><rect x="219" y="215" width="5" height="5"/><rect x="226" y="215" width="5" height="5"/><rect x="233" y="215" width="5" height="5"/><rect x="240" y="215" width="5" height="5"/><rect x="247" y="215" width="5" height="5"/>
      <rect x="212" y="222" width="5" height="5"/><rect x="219" y="222" width="5" height="5"/><rect x="226" y="222" width="5" height="5"/><rect x="233" y="222" width="5" height="5"/><rect x="240" y="222" width="5" height="5"/><rect x="247" y="222" width="5" height="5"/>
      <rect x="212" y="229" width="5" height="5"/><rect x="219" y="229" width="5" height="5"/><rect x="226" y="229" width="5" height="5"/><rect x="233" y="229" width="5" height="5"/><rect x="240" y="229" width="5" height="5"/><rect x="247" y="229" width="5" height="5"/>
      <rect x="212" y="236" width="5" height="5"/><rect x="219" y="236" width="5" height="5"/><rect x="226" y="236" width="5" height="5"/><rect x="233" y="236" width="5" height="5"/><rect x="240" y="236" width="5" height="5"/><rect x="247" y="236" width="5" height="5"/>
    </g>
    <g fill="#d08a2a">
      <rect x="254" y="215" width="5" height="5"/><rect x="261" y="215" width="5" height="5"/><rect x="268" y="215" width="5" height="5"/><rect x="275" y="215" width="5" height="5"/><rect x="282" y="215" width="5" height="5"/><rect x="289" y="215" width="5" height="5"/>
      <rect x="254" y="222" width="5" height="5"/><rect x="261" y="222" width="5" height="5"/><rect x="268" y="222" width="5" height="5"/><rect x="275" y="222" width="5" height="5"/><rect x="282" y="222" width="5" height="5"/><rect x="289" y="222" width="5" height="5"/>
      <rect x="254" y="229" width="5" height="5"/><rect x="261" y="229" width="5" height="5"/><rect x="268" y="229" width="5" height="5"/><rect x="275" y="229" width="5" height="5"/><rect x="282" y="229" width="5" height="5"/><rect x="289" y="229" width="5" height="5"/>
      <rect x="254" y="236" width="5" height="5"/><rect x="261" y="236" width="5" height="5"/><rect x="268" y="236" width="5" height="5"/><rect x="275" y="236" width="5" height="5"/><rect x="282" y="236" width="5" height="5"/><rect x="289" y="236" width="5" height="5"/>
    </g>
  </g>

  <rect x="24" y="284" width="280" height="76" rx="8" fill="#ffffff" stroke="#8c959f" stroke-dasharray="5 4"/>
  <text class="muted" x="40" y="306">Hidden from the network</text>
  <text class="s" x="40" y="324">foe stat points, unrevealed picks,</text>
  <text class="s" x="40" y="340">PP left, future RNG keys</text>

  <rect x="24" y="378" width="10" height="10" rx="2" fill="#4f7cdb"/>
  <text class="l" x="40" y="387">own side</text>
  <rect x="104" y="378" width="10" height="10" rx="2" fill="#d08a2a"/>
  <text class="l" x="120" y="387">opponent</text>
  <rect x="186" y="378" width="10" height="10" rx="2" fill="#57606a"/>
  <text class="l" x="202" y="387">field</text>

  <path class="ar" d="M304 78 H350"/>
  <path class="ar" d="M304 157 H350"/>
  <path class="ar" d="M304 236 H350"/>

  <!-- Encoder -->
  <rect x="352" y="50" width="200" height="334" rx="10" fill="#eef3fe" stroke="#9db4ea"/>
  <text class="t" x="452" y="76" text-anchor="middle">Transformer encoder</text>
  <text class="s" x="452" y="94" text-anchor="middle">self-attention across</text>
  <text class="s" x="452" y="110" text-anchor="middle">every entity on the board</text>
  <rect x="372" y="126" width="160" height="26" rx="6" fill="#ffffff" stroke="#9db4ea"/>
  <text class="bar" x="452" y="143" text-anchor="middle">self-attention → FFN</text>
  <rect x="372" y="160" width="160" height="26" rx="6" fill="#ffffff" stroke="#9db4ea"/>
  <text class="bar" x="452" y="177" text-anchor="middle">self-attention → FFN</text>
  <rect x="372" y="194" width="160" height="26" rx="6" fill="#ffffff" stroke="#9db4ea"/>
  <text class="bar" x="452" y="211" text-anchor="middle">self-attention → FFN</text>
  <rect x="372" y="228" width="160" height="26" rx="6" fill="#ffffff" stroke="#9db4ea"/>
  <text class="bar" x="452" y="245" text-anchor="middle">self-attention → FFN</text>
  <rect x="372" y="262" width="160" height="26" rx="6" fill="#ffffff" stroke="#9db4ea"/>
  <text class="bar" x="452" y="279" text-anchor="middle">self-attention → FFN</text>
  <text class="s" x="452" y="324" text-anchor="middle">61 tokens in,</text>
  <text class="s" x="452" y="340" text-anchor="middle">61 contextual tokens out</text>

  <!-- Memory -->
  <rect x="700" y="50" width="276" height="78" rx="8" fill="#ecf7f0" stroke="#93cfa9"/>
  <text class="t" x="716" y="72">Recurrent memory</text>
  <text class="s" x="716" y="90">remembers what the game revealed</text>
  <text class="s" x="716" y="106">carried across turns, reset each game</text>
  <path class="ar" d="M552 89 H698"/>
  
  <!-- Heads -->
  <rect x="700" y="160" width="276" height="96" rx="8" fill="#fdf5e8" stroke="#f0cf98"/>
  <text class="t" x="716" y="182">Joint action head</text>
  <text class="s" x="716" y="200">27 commands per active Pokémon</text>
  <text class="s" x="716" y="216">coordinates the two actives</text>
  <text class="s" x="716" y="232">→ 729 logits, illegal ones masked</text>

  <rect x="700" y="270" width="276" height="50" rx="8" fill="#fdf5e8" stroke="#f0cf98"/>
  <text class="t" x="716" y="292">Team preview head</text>
  <text class="s" x="716" y="310">360 ordered picks: 4 of 6</text>

  <rect x="700" y="334" width="276" height="50" rx="8" fill="#fdf5e8" stroke="#f0cf98"/>
  <text class="t" x="716" y="356">Value head</text>
  <text class="s" x="716" y="374">tanh → expected result in [−1, 1]</text>

  <path class="ar" d="M838 128 V158"/>
  <text class="l" x="848" y="147">+ memory</text>

  <path class="ln" d="M552 295 H660"/>
  <path class="ln" d="M660 208 V359"/>
  <path class="ar" d="M660 208 H698"/>
  <path class="ar" d="M660 295 H698"/>
  <path class="ar" d="M660 359 H698"/>
  <text class="l" x="606" y="287" text-anchor="middle">contextual tokens</text>
</svg>
