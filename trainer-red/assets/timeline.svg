<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" width="1000" height="290" role="img" aria-labelledby="title desc">
  <title id="title">Trainer Red timeline</title>
  <desc id="desc">June 2026, first agent with replays, a Q network and CFR. September 2026, parity-first JAX engines never finish compiling. 30 September, vgcjax passes every parity gate. 5 to 6 October, 127.6 million games in 15 hours on eight RTX 5090. 12 October, rank 4 on the global Showdown ladder.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .ttl { font-size: 17px; font-weight: 700; }
    .date { font-size: 12.5px; font-weight: 600; fill: #656d76; letter-spacing: 0.4px; }
    .head { font-size: 14px; font-weight: 650; }
    .body { font-size: 12.5px; fill: #57606a; }
    .hl { fill: #1f63b8; }
  </style>
  <rect x="0.5" y="0.5" width="999" height="289" rx="14" fill="#ffffff" stroke="#d0d7de"/>
  <text class="ttl" x="28" y="40">Four months, from a simulator that would not compile to #4 on the ladder</text>

  <line x1="100" x2="900" y1="132" y2="132" stroke="#d0d7de" stroke-width="2"/>
  <line x1="700" x2="900" y1="132" y2="132" stroke="#2a78d6" stroke-width="3"/>

  <circle cx="100" cy="132" r="7" fill="#ffffff" stroke="#8c959f" stroke-width="2.5"/>
  <circle cx="300" cy="132" r="7" fill="#ffffff" stroke="#8c959f" stroke-width="2.5"/>
  <circle cx="500" cy="132" r="7" fill="#ffffff" stroke="#2a78d6" stroke-width="2.5"/>
  <circle cx="700" cy="132" r="7" fill="#ffffff" stroke="#2a78d6" stroke-width="2.5"/>
  <circle cx="900" cy="132" r="10" fill="#2a78d6" stroke="#ffffff" stroke-width="3"/>

  <text class="date" x="100" y="108" text-anchor="middle">JUN 2026</text>
  <text class="date" x="300" y="108" text-anchor="middle">SEP 2026</text>
  <text class="date" x="500" y="108" text-anchor="middle">30 SEP</text>
  <text class="date" x="700" y="108" text-anchor="middle">5–6 OCT</text>
  <text class="date hl" x="900" y="108" text-anchor="middle">12 OCT</text>

  <text class="head" x="100" y="172" text-anchor="middle">First agent</text>
  <text class="body" x="100" y="192" text-anchor="middle">human replays, a value</text>
  <text class="body" x="100" y="209" text-anchor="middle">network and root CFR</text>

  <text class="head" x="300" y="172" text-anchor="middle">Dead end</text>
  <text class="body" x="300" y="192" text-anchor="middle">parity-first JAX engines</text>
  <text class="body" x="300" y="209" text-anchor="middle">never finish compiling</text>

  <text class="head" x="500" y="172" text-anchor="middle">vgcjax</text>
  <text class="body" x="500" y="192" text-anchor="middle">rewritten from scratch;</text>
  <text class="body" x="500" y="209" text-anchor="middle">passes every parity gate</text>

  <text class="head" x="700" y="172" text-anchor="middle">Scale</text>
  <text class="body" x="700" y="192" text-anchor="middle">127.6M games in 15 h</text>
  <text class="body" x="700" y="209" text-anchor="middle">on 8× RTX 5090</text>

  <text class="head hl" x="900" y="172" text-anchor="middle">#4 worldwide</text>
  <text class="body" x="900" y="192" text-anchor="middle">official Showdown Reg M-C</text>
  <text class="body" x="900" y="209" text-anchor="middle">Bo3 ladder, Elo 1674</text>

  <text class="body" x="28" y="262">Since then: further training generations, 450M+ self-play games in total.</text>
</svg>
